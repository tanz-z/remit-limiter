services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  app:
    build: .
    ports:
      - "3000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_ALGORITHM: token_bucket
      RATE_LIMIT_FAILURE_MODE: fail_open
      RATE_LIMIT_DEFAULT_CAPACITY: "100"
      RATE_LIMIT_DEFAULT_REFILL_RATE: "50"
    depends_on:
      redis:
        condition: service_healthy
    # to simulate multiple service instances, override with --scale app=3
    # (you'll need a load balancer like nginx in front for that; see README)
